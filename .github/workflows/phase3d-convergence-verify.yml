name: phase3d-convergence-verify

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Phase 3 targeted verification
        run: >-
          pnpm vitest run
          tests/unit/temporal-evidence.test.ts
          tests/unit/ctcl-http-adapter.test.ts
          tests/unit/ctcl-attestation.test.ts
          tests/unit/temporal-trust.test.ts
          tests/unit/temporal-provenance.test.ts
          tests/unit/temporal-wake-compiler.test.ts
          tests/integration/shared-instant-handoff.test.ts
      - name: Full test suite
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Architecture boundary audit
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'commoninstant|adapter-ctcl' -- packages/coordinator packages/policy-engine; then
            echo 'unexpected CTCL coupling in coordinator/policy-engine'
            exit 1
          fi
          if git grep -n -E 'DurableObject|D1|R2|control-plane' -- packages/temporal-evidence packages/temporal-wake packages/adapters/ctcl; then
            echo 'unexpected control-plane coupling in temporal packages'
            exit 1
          fi
          test "$(git hash-object docs/superpowers/plans/2026-08-17-phase3-temporal-provenance-shared-instant.md)" = '2fa84b067bb433cf89af5b3ded4d6bbae219fd80'
      - name: Live smoke remains opt-in
        shell: bash
        run: |
          set +e
          pnpm tsx scripts/ctcl-live-smoke.ts >/tmp/ctcl-smoke-out 2>/tmp/ctcl-smoke-err
          status=$?
          set -e
          test "$status" -eq 2
          grep -q 'Refusing live CTCL smoke' /tmp/ctcl-smoke-err
