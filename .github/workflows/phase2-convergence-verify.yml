name: phase2-convergence-verify

on:
  push:
    branches:
      - phase2-pluggable-residence-storage

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-pluggable-residence-storage
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Regenerate workspace lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Verify legacy Drive fake is absent from code and config
        run: |
          if git grep -n -E 'FakeDriveAdapter|FakeDriveFile|@arcp/adapter-drive|the real adapter \(Phase 2\) implements' -- . \
            ':(exclude)docs/superpowers/specs/2026-08-17-phase2-pluggable-residence-storage-design.md' \
            ':(exclude)docs/superpowers/plans/2026-08-17-phase2-residence-storage-implementation.md'; then
            echo 'legacy Drive references remain outside archived design/plan docs'
            exit 1
          fi
      - name: Full tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Filesystem security regressions
        run: pnpm vitest run tests/unit/synced-filesystem-path-guard.test.ts tests/unit/synced-filesystem-adapter.test.ts
      - name: Credential-free Google regressions
        run: pnpm vitest run tests/unit/google-drive-http-transport.test.ts tests/unit/google-drive-adapter.test.ts
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: finalize Phase 2 residence lockfile'
          git push origin HEAD:phase2-pluggable-residence-storage
